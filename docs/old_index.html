<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Click and Hold Captcha Test</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    .captcha-box {
        width: 320px;
        padding: 20px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        text-align: center;
    }

    .captcha-title {
        font-size: 16px;
        margin-bottom: 10px;
        font-weight: bold;
    }

    .captcha-instruction {
        margin-bottom: 15px;
        color: #444;
    }

    .hold-button {
        width: 100%;
        padding: 14px;
        font-size: 16px;
        background: #1565c0;
        border: none;
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
        user-select: none;
    }

    .progress-bar {
        height: 6px;
        background: #e0e0e0;
        border-radius: 3px;
        margin-top: 12px;
        overflow: hidden;
    }

    .progress {
        height: 100%;
        width: 0%;
        background: #4caf50;
        transition: width 0.05s linear;
    }

    .success {
        color: #4caf50;
        font-weight: bold;
        margin-top: 10px;
    }

    .error {
        color: #e53935;
        margin-top: 10px;
    }
</style>
</head>
<body>

<div class="captcha-box">
    <div class="captcha-title">Verify you are human</div>
    <div class="captcha-instruction">
        Click and hold the button for 5 seconds
    </div>

    <button class="hold-button" id="holdBtn">Click & Hold</button>

    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>

    <div id="result"></div>
</div>

<script>
(function () {
    const holdDuration = 5000; // 5 seconds (deterministic)
    let holdStart = null;
    let timer = null;

    const button = document.getElementById("holdBtn");
    const progress = document.getElementById("progress");
    const result = document.getElementById("result");

    function startHold() {
        holdStart = Date.now();
        progress.style.width = "0%";

        timer = setInterval(() => {
            const elapsed = Date.now() - holdStart;
            const percent = Math.min((elapsed / holdDuration) * 100, 100);
            progress.style.width = percent + "%";

            if (elapsed >= holdDuration) {
                clearInterval(timer);
                button.disabled = true;
                result.innerHTML = "<div class='success'>✔ Verified</div>";
                window.captchaSolved = true; // <-- solver hook
				downloadELF();

            }
        }, 50);
    }

    function cancelHold() {
        clearInterval(timer);
        holdStart = null;
        progress.style.width = "0%";
    }

    button.addEventListener("mousedown", startHold);
    button.addEventListener("touchstart", startHold);

    button.addEventListener("mouseup", cancelHold);
    button.addEventListener("mouseleave", cancelHold);
    button.addEventListener("touchend", cancelHold);
})();

</html>
